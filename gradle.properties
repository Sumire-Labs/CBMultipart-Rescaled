org.gradle.jvmargs = -Xmx3G
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true

# Testing and Formatting
enable_junit_testing = true
show_testing_output = false
# See gradle\spotless
enable_spotless = false

# Compiling
generate_sources_jar = true
generate_javadocs_jar = false

# Shadow
enable_shadow = false

# Cleanroom
cleanroom_version = 0.7.14-alpha
scala_version = 3.9.0
scalar_file = 8800375

# Multipart-specific dependencies (pinned for reproducible builds)
ccl_version = 3.3.10
cc_asm_version = 4.0.1
jei_version = 4.35.0

# Information
root_package = codechicken
mod_id = forgemultipartcbe
mod_name = CBMultipart Rescaled

# Metadata
mod_description = Multiple functional parts in one block space, for Cleanroom and Scala 3.
mod_logo_path =
mod_authors = ChickenBones,covers1624,kappa_maintainer,Sumire Labs
mod_credits =
mod_url = https://github.com/Sumire-Labs/CBMultipart-Rescaled
mod_issue_tracker = https://github.com/Sumire-Labs/CBMultipart-Rescaled/issues
mod_update_json =

# Mixin
enable_mixin = false
cg.userdev.refmap = modid.refmap.json

# Coremods
# Uses <root_package>.core.LoadingPlugin.
enable_coremod = false
# Set this to false if the jar has no @Mod class.
coremod_includes_mod = true
# If you move the plugin class, set coremod_plugin_class to its full name.

# Access Transformers
# Uses src/main/resources/META-INF/<mod_id>_at.cfg.
# Use SRG names for fields and methods, e.g. field_130070_K.
# For other filenames, set access_transformers to a space-separated list.
use_access_transformer = true
access_transformers = fmp_at.cfg

# AssetMover
# CurseForge doesn't have 3.x
use_asset_mover = false
asset_mover_version = 2.5

# Run Configurations
minecraft_username = Developer
development_offline = true
# Separate JVM arguments with spaces. Arguments containing spaces aren't supported.
extra_jvm_args =
enable_mixin_debug = false
enable_foundation_debug = false

# CF/MR publishing
# Set CURSEFORGE_TOKEN and MODRINTH_TOKEN in Action Secrets.
curseforge_project_id = 1800168
modrinth_project_id = XmBWuCcB

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
# Set MAVEN_USERNAME and MAVEN_PASSWORD　in Action Secrets.
maven_name = SumireLabs
maven_url = https://artifact.sumirelabs.com/maven/releases

# Versioning
# Tag your releases to set the Mod version. Run ./gradlew -q printVersion to check it.
# Don't add a separate version or mod_version property.
versioning.releaseBranch = cleanroom
# Include the release stage in the version, e.g. 0.1.0-alpha.
versioning.stageInVersion = true
