name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build, test and check formatting
        run: ./gradlew clean build -Penable_junit_testing=true -Penable_spotless=true --console=plain
      - name: Verify dedicated server and dynamic trait generation
        timeout-minutes: 5
        run: ./gradlew runServer -Psmoke_test=true --no-configuration-cache --console=plain
      - name: Verify Maven artifacts locally
        run: ./gradlew publishToMavenLocal -Ppublish_to_local_maven=true --console=plain
      - name: Verify installed Cleanroom with distribution jars
        timeout-minutes: 10
        run: bash .github/scripts/production-smoke.sh
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnostics
          path: |
            build/reports/tests/
            run/smoke-server/logs/
            run/smoke-server/crash-reports/
            run/production-smoke/logs/
            run/production-smoke/crash-reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jars
          path: |
            build/libs/*.jar
            !build/libs/*-mcp.jar
          if-no-files-found: error
