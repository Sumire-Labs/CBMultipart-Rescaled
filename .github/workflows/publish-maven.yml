name: Publish Maven

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish to Maven
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: maven-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Supply a version tag, for example 3.0.0.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Support tags created on Windows
        run: |
          git config core.filemode false
          chmod +x gradlew
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check credentials and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo 'Set MAVEN_USERNAME and MAVEN_PASSWORD secrets.' >&2
            exit 1
          fi
          version=$(./gradlew -q --console=plain printVersion)
          if [[ "$version" != "${RELEASE_TAG#v}" ]]; then
            echo "Version $version does not match tag $RELEASE_TAG." >&2
            exit 1
          fi
      - name: Build and verify
        run: ./gradlew clean build --console=plain
      - name: Publish Maven artifacts only
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: >-
          ./gradlew publish --console=plain
          -Ppublish_to_maven=true -Ppublish_to_local_maven=false
          -Pcurseforge_project_id= -Pmodrinth_project_id=
